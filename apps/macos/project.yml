name: DynamicNotch
options:
  bundleIdPrefix: app.dynamicnotch
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  DynamicNotch:
    type: application
    platform: macOS
    sources:
      - DynamicNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dynamicnotch.DynamicNotch
        INFOPLIST_FILE: DynamicNotch/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DynamicNotchTests
  DynamicNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DynamicNotchTests
    dependencies:
      - target: DynamicNotch
  DynamicNotchUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - DynamicNotchUITests
    dependencies:
      - target: DynamicNotch
