name: NotchFlow
options:
  bundleIdPrefix: app.notchflow
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  NotchFlow:
    type: application
    platform: macOS
    sources:
      - NotchFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notchflow.NotchFlow
        INFOPLIST_FILE: NotchFlow/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - NotchFlowTests
  NotchFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NotchFlowTests
    dependencies:
      - target: NotchFlow
  NotchFlowUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - NotchFlowUITests
    dependencies:
      - target: NotchFlow
